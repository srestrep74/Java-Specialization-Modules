version: '3.8'

services:
  # ClickHouse - Database for storing metrics, traces, and logs
  clickhouse:
    image: clickhouse/clickhouse-server:23.7-alpine
    container_name: signoz-clickhouse
    hostname: clickhouse
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./signoz-config/clickhouse-config.xml:/etc/clickhouse-server/config.xml
      - ./signoz-config/clickhouse-users.xml:/etc/clickhouse-server/users.xml
    environment:
      - CLICKHOUSE_DB=signoz
      - CLICKHOUSE_USER=signoz
      - CLICKHOUSE_PASSWORD=signoz123
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - signoz

  # Query Service - API layer for SigNoz UI
  query-service:
    image: signoz/query-service:0.38.2
    container_name: signoz-query-service
    command: ["-config=/root/config/prometheus.yml"]
    ports:
      - "8080:8080"
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000/?database=signoz
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - DEPLOYMENT_TYPE=docker-standalone-amd
    volumes:
      - ./signoz-config/prometheus.yml:/root/config/prometheus.yml
      - dashboards-data:/root/config/dashboards
      - signoz-data:/var/lib/signoz
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - signoz

  # Frontend - SigNoz UI
  frontend:
    image: signoz/frontend:0.38.2
    container_name: signoz-frontend
    ports:
      - "3301:3301"
    environment:
      - QUERY_SERVICE_URL=http://query-service:8080
    depends_on:
      - query-service
    networks:
      - signoz

  # OpenTelemetry Collector - Receives traces, metrics, and logs
  otel-collector:
    image: signoz/signoz-otel-collector:0.88.11
    container_name: signoz-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
      - "8888:8888"     # Prometheus metrics exposed by the collector
      - "8889:8889"     # Prometheus exporter metrics
      - "9411:9411"     # Zipkin receiver
      - "13133:13133"   # Health check extension
      - "14250:14250"   # Jaeger gRPC receiver
      - "14268:14268"   # Jaeger HTTP receiver
      - "55679:55679"   # zPages extension
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - DOCKER_MULTI_NODE_CLUSTER=false
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    volumes:
      - ./signoz-config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - signoz-data:/var/lib/signoz
    depends_on:
      clickhouse:
        condition: service_healthy
      query-service:
        condition: service_healthy
    networks:
      - signoz

  # Log Collector - For collecting logs from files
  logspout:
    image: signoz/logspout:v0.2.0
    container_name: signoz-logspout
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: syslog+tcp://otel-collector:2255
    environment:
      - SYSLOG_FORMAT=rfc3164
    depends_on:
      - otel-collector
    networks:
      - signoz

volumes:
  clickhouse-data:
  dashboards-data:
  signoz-data:

networks:
  signoz:
    driver: bridge 