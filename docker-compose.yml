version: '3.8'

services:
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
      # Para producción, puedes usar MySQL/Cassandra/Elasticsearch:
      # - STORAGE_TYPE=mysql
      # - MYSQL_HOST=mysql
    networks:
      - microservices-network

  # Opcional: Si quieres persistencia con MySQL
  # mysql:
  #   image: mysql:8.0
  #   container_name: zipkin-mysql
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=zipkin
  #     - MYSQL_DATABASE=zipkin
  #     - MYSQL_USER=zipkin
  #     - MYSQL_PASSWORD=zipkin
  #   volumes:
  #     - zipkin-mysql-data:/var/lib/mysql
  #   networks:
  #     - microservices-network

networks:
  microservices-network:
    driver: bridge

