server:
    port: 8888
    error:
        include-message: always

spring:
    application:
        name: config-server
    cloud:
        config:
            server:
                git:
                    uri: https://github.com/YourUsername/your-config-repo
                    default-label: main
                    search-paths: 
                        - '*service*/*/config'
                        - 'config/*'
                    clone-on-start: true
                    timeout: 5
                    force-pull: true
