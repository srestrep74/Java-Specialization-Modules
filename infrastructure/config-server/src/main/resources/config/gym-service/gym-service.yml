server:
  port: 8081
  error:
    include-message: always

spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${vcap.application.instance_id:${spring.application.instance_id:${random.value}}}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoint:
    health:
      show-details: always
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_SERVER_URL:http://localhost:9411/api/v2/spans}

micrometer:
  tracing:
    propagation:
      type: B3
    brave:
      span-joining-supported: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:5JI1p09GOcOlK9z8A/QBiLM7P+ZzS7DBvzIKM5G6Md2jYMkSvCbdQR13nPhJGwKkXZvRK9lNCPUXX/bSA44qzw==}
  expiration: 1800000
  refresh-expiration: 604800000

security:
  login:
    max-attempts: 3
    lock-time-minutes: 5

feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 22000
        loggerLevel: basic
      workload-service:
        connectTimeout: 10000
        readTimeout: 22000
        loggerLevel: full
  circuitbreaker:
    enabled: true  # ¡HABILITADO!
    group:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      # Configuración para workload-relay-client (contextId del primer Feign client)
      workload-relay-client:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 3  # Reducido para testing
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 60  # 60% de fallos para abrir
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 5s
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.util.concurrent.TimeoutException
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException
          - java.io.IOException
          - java.net.ConnectException
      # Configuración para workload-service-client (contextId del segundo Feign client)
      workload-service-client:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 60
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 5s
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.util.concurrent.TimeoutException
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException
          - java.io.IOException
          - java.net.ConnectException
  timelimiter:
    instances:
      workload-relay-client:
        timeoutDuration: 15s
      workload-service-client:
        timeoutDuration: 15s
  retry:
    instances:
      workload-relay-client:
        maxAttempts: 2
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.FeignException$ServiceUnavailable
          - java.net.ConnectException
      workload-service-client:
        maxAttempts: 2
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.FeignException$ServiceUnavailable
          - java.net.ConnectException

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"
  level:
    io.github.resilience4j.circuitbreaker: DEBUG
    io.github.resilience4j.timelimiter: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    feign: DEBUG