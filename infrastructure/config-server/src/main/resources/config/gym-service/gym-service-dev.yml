spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jpa_epam}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000
      password: ""
  cache:
    type: redis
    
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

feign:
  circuitbreaker:
    enabled: true

logging:
  level:
    com.sro: INFO
    org.springframework: INFO
    org.hibernate: WARN

management:
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    enable:
      all: true

storage:
  init:
    file: classpath:init_data.json

jwt:
  secret: ${JWT_SECRET:5JI1p09GOcOlK9z8A/QBiLM7P+ZzS7DBvzIKM5G6Md2jYMkSvCbdQR13nPhJGwKkXZvRK9lNCPUXX/bSA44qzw==}
  expiration: 1800000
  refresh-expiration: 604800000
  blacklist:
    prefix: "blacklisted_token:"
    cleanup-interval: 3600000
  refresh:
    prefix: "user:refresh_tokens:"
    expiry: 7

