spring:
  datasource:
    url: jdbc:h2:mem:workloaddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  pattern:
    # Enhanced console pattern with colors, timestamp, level, thread, logger, MDC, and message
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %X{requestId:--} %X{user:--} %m%n%wEx"
  level:
    # Application logging levels (more verbose for local development)
    dev.sro.workload_service: DEBUG
    dev.sro.workload_service.application.aspect.LoggingAspect: DEBUG
    dev.sro.workload_service.presentation.exception.GlobalExceptionHandler: DEBUG
    dev.sro.workload_service.application.service: DEBUG
    dev.sro.workload_service.domain.repository: DEBUG
    dev.sro.workload_service.infrastructure.repository: DEBUG
    dev.sro.workload_service.presentation.controller: DEBUG
    dev.sro.workload_service.application.mapper: TRACE
    
    # Spring framework logging
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.aop: DEBUG
    org.aspectj: DEBUG
    
    # Database logging (detailed for local development)
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.orm.jpa: DEBUG
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
    
    # HTTP client logging
    org.springframework.web.client: DEBUG
    
    # Metrics and monitoring
    io.micrometer: DEBUG

management:
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    enable:
      all: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        trainer.workload.sessions: true
        trainer.workload.duration: true

debug: true 