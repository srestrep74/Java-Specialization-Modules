spring:
  datasource:
    url: jdbc:mysql://localhost:3307/workload_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: workload_user
    password: workload_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

logging:
  level:
    dev.sro.workload_service: INFO
    org.springframework: INFO
    org.hibernate: WARN

management:
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    enable:
      all: true 