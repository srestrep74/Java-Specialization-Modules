spring:
  datasource:
    url: jdbc:mysql://localhost:3307/workload_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: workload_user
    password: workload_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

logging:
  pattern:
    # Console pattern for development environment
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %X{requestId:--} %X{user:--} %m%n%wEx"
  level:
    # Application logging levels (balanced for development)
    dev.sro.workload_service: INFO
    dev.sro.workload_service.application.aspect.LoggingAspect: INFO
    dev.sro.workload_service.presentation.exception.GlobalExceptionHandler: INFO
    dev.sro.workload_service.application.service: INFO
    dev.sro.workload_service.domain.repository: DEBUG
    dev.sro.workload_service.infrastructure.repository: DEBUG
    dev.sro.workload_service.presentation.controller: INFO
    dev.sro.workload_service.application.mapper: WARN
    
    # Spring framework logging
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.aop: INFO
    org.aspectj: INFO
    
    # Database logging (moderate for development)
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.orm.jpa: INFO
    
    # HTTP client logging
    org.springframework.web.client: INFO
    
    # Root level
    root: INFO

management:
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    enable:
      all: true 