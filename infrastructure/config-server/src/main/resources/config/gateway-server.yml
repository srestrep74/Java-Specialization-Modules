server:
  port: 8083
  error:
    include-message: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: gym-service-route
              uri: lb://gym-service
              predicates:
                - Path=/api/v1/{segment:trainees|trainers|trainings|training-types|auth}/**
            
            - id: workload-service-route
              uri: lb://workload-service
              predicates:
                - Path=/api/v1/workloads/**

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    reactor.netty.http.client: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0  # 100% sampling for development, reduce in production
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Micrometer Tracing configuration
micrometer:
  tracing:
    propagation:
      type: B3  # or W3C
    brave:
      span-joining-supported: true