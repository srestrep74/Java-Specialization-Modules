server:
  port: 8083
  error:
    include-message: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: gym-service-route
              uri: lb://gym-service
              predicates:
                - Path=/api/v1/{segment:trainees|trainers|trainings|training-types|auth}/**
            
            - id: workload-service-route
              uri: lb://workload-service
              predicates:
                - Path=/api/v1/workloads/**

jwt:
  secret: 5JI1p09GOcOlK9z8A/QBiLM7P+ZzS7DBvzIKM5G6Md2jYMkSvCbdQR13nPhJGwKkXZvRK9lNCPUXX/bSA44qzw==

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    reactor.netty.http.client: DEBUG