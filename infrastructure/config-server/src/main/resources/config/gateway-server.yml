server:
  port: 8083
  error:
    include-message: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: gym-service-route
          uri: lb://gym-service
          predicates:
            - Path=/api/v1/trainees/**, /api/v1/trainers/**, /api/v1/trainings/**, /api/v1/training-types/**, /api/v1/auth/**
        
        - id: workload-service-route
          uri: lb://workload-service
          predicates:
            - Path=/api/v1/workloads/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    reactor.netty.http.client: DEBUG 