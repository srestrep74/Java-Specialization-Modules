server:
  port: 8083
  error:
    include-message: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: gym-service-route
              uri: lb://gym-service
              predicates:
                - Path=/api/v1/{segment:trainees|trainers|trainings|training-types|auth}/**
            
            - id: workload-service-route
              uri: lb://workload-service
              predicates:
                - Path=/api/v1/workloads/**

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    reactor.netty.http.client: DEBUG

# OpenTelemetry Configuration for SigNoz
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        spring.cloud.gateway.requests: true
  tracing:
    sampling:
      probability: 1.0  # 100% sampling for development
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        headers:
          signoz-service-name: gateway-server
    tracing:
      endpoint: http://localhost:4318/v1/traces
      headers:
        signoz-service-name: gateway-server

# OpenTelemetry Resource Attributes
otel:
  resource:
    attributes:
      service.name: gateway-server
      service.namespace: fitness-app
      deployment.environment: ${spring.profiles.active:default}