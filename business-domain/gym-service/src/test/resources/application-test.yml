spring:
  application:
    name: gym-service
  # Disable config server import for tests
  config:
    import: ""
  
  # H2 In-Memory Database (Test)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  
  # JPA / Hibernate (Test)
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  sql:
    init:
      mode: always
  
  # Disable Redis for tests
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000
      password: ""
  cache:
    type: none
  
  # Disable cloud features for tests
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

feign:
  client:
    config:
      default:
        enabled: false
  circuitbreaker:
    enabled: false

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.test: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE

# Token Storage Configuration (Test)
jwt:
  blacklist:
    prefix: "blacklisted_token:"
    cleanup-interval: 60000
  refresh:
    prefix: "user:refresh_tokens:"
    expiry: 30
  secret: "5JI1p09GOcOlK9z8A/QBiLM7P+ZzS7DBvzIKM5G6Md2jYMkSvCbdQR13nPhJGwKkXZvRK9lNCPUXX/bSA44qzw=="
  expiration: 120000
  refresh-expiration: 604800000

# Storage configuration
storage:
  init:
    file: "classpath:init_data.json"

# Management and actuator
management:
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: false 