spring:
  application:
    name: gym-service
  # Allow bean definition overriding for tests
  main:
    allow-bean-definition-overriding: true
  # Disable config server import for tests
  config:
    import: ""
  
  # H2 In-Memory Database (Test)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  
  # JPA / Hibernate (Test)
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  sql:
    init:
      mode: always
  
  # ActiveMQ Configuration for tests
  activemq:
    broker-url: vm://embedded?broker.persistent=false
    user: admin
    password: admin
    packages:
      trust-all: true
  jms:
    pub-sub-domain: false

  # Disable Redis for tests
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000
      password: ""
  cache:
    type: none

  # Disable cloud features for tests
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false
    # Disable Eureka client for component tests
    discovery:
      enabled: false
    # Disable config server for tests
    config:
      enabled: false
      discovery:
        enabled: false
      retry:
        enabled: false
      fail-fast: false
      request-read-timeout: 5000
      connect-timeout: 5000

# Disable Eureka client
eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true

feign:
  client:
    config:
      default:
        enabled: false
  circuitbreaker:
    enabled: false

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.test: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE

# Token Storage Configuration (Test)
jwt:
  blacklist:
    prefix: "blacklisted_token:"
    cleanup-interval: 60000
  refresh:
    prefix: "user:refresh_tokens:"
    expiry: 30
  secret: "5JI1p09GOcOlK9z8A/QBiLM7P+ZzS7DBvzIKM5G6Md2jYMkSvCbdQR13nPhJGwKkXZvRK9lNCPUXX/bSA44qzw=="
  expiration: 120000
  refresh-expiration: 604800000

# Test Configuration Properties
test:
  jwt:
    secret: "5JI1p09GOcOlK9z8A/QBiLM7P+ZzS7DBvzIKM5G6Md2jYMkSvCbdQR13nPhJGwKkXZvRK9lNCPUXX/bSA44qzw=="
    expiration: 120000
    refresh-expiration: 604800000
    blacklist:
      prefix: "blacklisted_token:"
      cleanup-interval: "60000"
    refresh:
      prefix: "user:refresh_tokens:"
      expiry: 30

# Login Security Configuration (Test)
security:
  login:
    max-attempts: 3
    lock-time-minutes: 5

# Storage configuration
storage:
  init:
    file: "classpath:init_data.json"

# Management and actuator
management:
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: false