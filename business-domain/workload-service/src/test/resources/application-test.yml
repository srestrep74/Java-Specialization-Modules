spring:
  application:
    name: workload-service
  # Disable config server import for tests
  config:
    import: ""
  
  # ActiveMQ Configuration for tests
  activemq:
    broker-url: vm://embedded?broker.persistent=false
    user: admin
    password: admin
    packages:
      trust-all: true
  jms:
    pub-sub-domain: false
  
  # MongoDB Configuration (Test)
  data:
    mongodb:
      host: localhost
      port: 27017
      database: workload_test_db
      username: admin
      password: admin123
      authentication-database: admin  
      auto-index-creation: false
      clean-on-startup: true
    # Disable Redis for tests
    redis:
      host: localhost
      port: 6379
      timeout: 5000
      password: ""
  cache:
    type: none
  
  # Disable cloud features for tests
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

# JMS Redelivery Configuration for tests
app:
  jms:
    max-redeliveries: 3
    initial-redelivery-delay: 2000
    redelivery-delay-max: 5000

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.test: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE
    org.springframework.data.mongodb: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG

# Token Storage Configuration (Test)
jwt:
  blacklist:
    prefix: "blacklisted_token:"
    cleanup-interval: 60000
  refresh:
    prefix: "user:refresh_tokens:"
    expiry: 30
  secret: "5JI1p09GOcOlK9z8A/QBiLM7P+ZzS7DBvzIKM5G6Md2jYMkSvCbdQR13nPhJGwKkXZvRK9lNCPUXX/bSA44qzw=="
  expiration: 120000
  refresh-expiration: 604800000

# Management and actuator
management:
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: false 