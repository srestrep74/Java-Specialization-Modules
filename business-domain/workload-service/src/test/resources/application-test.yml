spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  data:
    mongodb:
      host: localhost
      port: 27017
      database: workload_test_db
      authentication-database: admin
      username: admin
      password: admin123
      auto-index-creation: true
  
  # ActiveMQ Configuration for tests
  activemq:
    broker-url: vm://embedded?broker.persistent=false
    user: admin
    password: admin
    packages:
      trust-all: true
  jms:
    pub-sub-domain: false

logging:
  level:
    dev.sro.workload_service: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# JWT Configuration for tests
jwt:
  secret: 5JI1p09GOcOlK9z8A/QBiLM7P+ZzS7DBvzIKM5G6Md2jYMkSvCbdQR13nPhJGwKkXZvRK9lNCPUXX/bSA44qzw==
  expiration: 1800000
  refresh-expiration: 604800000
  blacklist:
    prefix: "blacklist:"
    cleanup-interval: 3600000
  refresh:
    prefix: "refresh:"
    expiry: 7

# JMS Redelivery Configuration for tests
app:
  jms:
    maxRedeliveries: 3
    initialRedeliveryDelay: 1000
    backOffMultiplier: 2.0
    useExponentialBackOff: true

# Test specific configurations
test:
  auth:
    enabled: false
  mock:
    enabled: true 