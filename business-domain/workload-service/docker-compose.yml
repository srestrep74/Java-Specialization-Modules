services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: workload-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: workload_db
      MYSQL_USER: workload_user
      MYSQL_PASSWORD: workload_pass
    ports:
      - "3307:3306"  # Exposing MySQL on port 3307 on the host
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 30s

  # phpMyAdmin for database management (MySQL Workbench alternative)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: workload-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
      PMA_ARBITRARY: 1
    ports:
      - "8080:80"  # Exposing phpMyAdmin on port 8080
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local 